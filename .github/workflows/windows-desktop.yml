name: Windows desktop

on:
  workflow_dispatch:
  push:
    branches: ["codex/windows-desktop"]
  pull_request:
    paths:
      - "**.py"
      - "index.html"
      - "sites/**"
      - "requirements-*.txt"
      - "BossJobs.spec"
      - "scripts/**"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-*.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Ensure WebView2 Runtime
        shell: pwsh
        run: |
          $keys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          $versions = @($keys | ForEach-Object { (Get-ItemProperty $_ -ErrorAction SilentlyContinue).pv } |
            Where-Object { $_ -and $_ -ne '0.0.0.0' })
          if ($versions.Count -eq 0) {
            $installer = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $installer
            $signature = Get-AuthenticodeSignature $installer
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') {
              throw 'Unexpected WebView2 installer signature.'
            }
            $process = Start-Process $installer -ArgumentList '/silent', '/install' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "WebView2 installer failed: $($process.ExitCode)" }
          }
      # Windows hosted runner 已提供 Chrome；原生窗口和驱动验收不得静默跳过。
      - name: Test, package and verify native desktop
        run: python scripts/build_windows.py
      - name: Upload desktop package
        uses: actions/upload-artifact@v4
        with:
          name: BossJobs-windows-x64
          path: dist/BossJobs-windows-x64.zip
          if-no-files-found: error
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-report
          path: dist/windows-smoke.json
          if-no-files-found: ignore
